name: Bug report
description: Something Autocache does is wrong, or something it should do does not happen.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. See SECURITY.md for private reporting.

        Before filing: state files are plain JSON under `~/.autocache/`. Reading them
        is usually faster than guessing, and hook exit codes tell you nothing - hooks
        always exit 0 by design.

  - type: checkboxes
    id: severity
    attributes:
      label: Did this break your session?
      description: A hook that blocks, crashes, or hangs a session is the highest-priority class of bug in this project.
      options:
        - label: A hook blocked, crashed, or hung the session (fail-open violation)
        - label: The session was fine; the behavior was just wrong or missing

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Claude Code
        - Codex
        - Grok
        - Other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 26200 / macOS 15.3 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Autocache version
      description: From `.claude-plugin/plugin.json`, or the commit you installed.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that shows the problem.
      placeholder: |
        1. Start a session in a git repository
        2. Open a breadcrumb with /breadcrumb
        3. End the session
        4. Start a new session - the restore block is missing
    validations:
      required: true

  - type: textarea
    id: hook-output
    attributes:
      label: Hook output
      description: |
        Run the relevant hook by hand against a throwaway state root and paste stdout,
        stderr, and the exit code. Recipe in docs/hooks.md.
      render: shell

  - type: textarea
    id: state
    attributes:
      label: Relevant state
      description: |
        Paste the relevant files from `~/.autocache/` - the tail of `logs/events.jsonl`
        is usually the fastest signal. Redact paths or titles you do not want public.
      render: json

  - type: input
    id: autocache-home
    attributes:
      label: AUTOCACHE_HOME
      description: Leave blank if unset.
